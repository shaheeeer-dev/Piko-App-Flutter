name: piko
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Rebuild with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#173E35"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  background_color_ios: "#173E35"

# Native launch screen ends when Flutter draws C01's first frame.
# Rebuild with: dart run flutter_native_splash:create
flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#173E35"
  color_dark: "#173E35"
  image: assets/images/splash_logo.png
  image_dark: assets/images/splash_logo.png
  android_gravity: center
  ios_content_mode: center
  fullscreen: false
  android_12:
    color: "#173E35"
    color_dark: "#173E35"
    image: assets/images/splash_logo_android12.png
    image_dark: assets/images/splash_logo_android12.png
